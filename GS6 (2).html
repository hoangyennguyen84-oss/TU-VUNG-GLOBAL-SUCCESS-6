            font-size: 0.95rem;
            font-weight: bold;

        }

            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {

        }

            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: #4a90e2;
            border: none;

            min-height: 25px;

    let currentList = [];

    let currentIndex = 0;
    let round = 1;
    let lockSubmit = false;

    function shuffle(arr) {
        let array = [...arr];
        for (let i = array.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startGame() {
        let val = document.getElementById('unitSelect').value;
        if (val === 'all') {
            currentList = shuffle(data);
        } else {
            let filtered = data.filter(item => item.u == val);
            currentList = shuffle(filtered);
        }
        wrongList = [];
        currentIndex = 0;
        round = 1;
        lockSubmit = false;
        document.getElementById('quizBox').style.display = "block";
        document.getElementById('roundTitle').innerText = "Vòng 1: Học Từ Mới";
        showNextWord();
    }

    function showNextWord() {
        lockSubmit = false;
        
        if (currentIndex >= currentList.length) {
            if (wrongList.length > 0) {
                round++;
                currentList = shuffle(wrongList);
                wrongList = [];
                currentIndex = 0;
                document.getElementById('roundTitle').innerText = `Vòng ${round}: Ôn Lại Từ Chưa Thuộc`;
                alert(`Kết thúc vòng! Còn ${currentList.length} từ chưa thuộc. Bắt đầu ôn lại!`);
            } else {
                document.getElementById('meaningBox').innerText = "🎉 XUẤT SẮC!";
                document.getElementById('typeTag').innerText = "";
                document.getElementById('feedback').className = "feedback correct";
                document.getElementById('feedback').innerText = "Bạn đã thuộc hết tất cả các từ trong phần này!";
                document.getElementById('quizBox').style.display = "none";
                document.getElementById('progressBar').style.width = "100%";
                document.getElementById('remainingCount').innerText = "0";
                return;
            }
        }

        let current = currentList[currentIndex];
        document.getElementById('meaningBox').innerText = current.m;
        document.getElementById('typeTag').innerText = current.t ? `(${current.t})` : "";
        document.getElementById('userInput').value = "";
        document.getElementById('feedback').innerText = "";
        
        let percent = (currentIndex / currentList.length) * 100;
        document.getElementById('progressBar').style.width = `${percent}%`;
        document.getElementById('remainingCount').innerText = currentList.length - currentIndex;

        setTimeout(() => {
            document.getElementById('userInput').focus();
        }, 80);
    }

    function speakVN() {

            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }

    function speakEN() {
        if (currentIndex < currentList.length) {
            let text = currentList[currentIndex].w;
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }

    function handlePress(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            checkAnswer();
        }
    }

    function checkAnswer() {
        if (lockSubmit) return;
        
        let inputVal = document.getElementById('userInput').value.trim();
        if (!inputVal) return;

        lockSubmit = true;
        let current = currentList[currentIndex];
        let feedbackEl = document.getElementById('feedback');

        let cleanInput = inputVal.toLowerCase().replace(/\s+/g, ' ');
        let cleanTarget = current.w.toLowerCase().replace(/\s+/g, ' ');

        if (cleanInput === cleanTarget) {
            feedbackEl.className = "feedback correct";
            feedbackEl.innerText = "✓ Chính xác!";
            setTimeout(() => {
                currentIndex++;
                showNextWord();
            }, 700);
        } else {
            feedbackEl.className = "feedback incorrect";
            feedbackEl.innerText = `✗ Sai rồi! Đáp án đúng: "${current.w}"`;
            
            if (!wrongList.some(item => item.w === current.w)) {
                wrongList.push(current);
            }
            setTimeout(() => {
                currentIndex++;
                showNextWord();
            }, 1800);
        }
    }

    // Tự động khởi chạy mượt mà ngay khi trang được tải
    window.onload = startGame;
</script>

</body>
</html>
